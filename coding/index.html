<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pbear.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P&Q Coder</title>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module">
      import('/src/App.jsx').catch((error) => {
        console.error('Application startup failed:', error);
        const root = document.getElementById('root');
        const heading = document.createElement('h1');
        heading.textContent = 'Application startup failed';
        const detail = document.createElement('p');
        detail.textContent = error?.message || 'Unknown startup error';
        root.replaceChildren(heading, detail);
      });
    </script>
  </body>
</html>
